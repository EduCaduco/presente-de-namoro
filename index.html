<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Dia dos Namorados</title>
    <style>
        body {
            margin: 0;
            padding: 0;
           background: linear-gradient(135deg, #0B0B1E 0%, #161633 40%, #2D142C 100%);
            background-size: 200% 200%;
            animation: movimentoGalaxia 20s ease infinite;
            color: white;
            font-family: 'Arial', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        body::before, body::after {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            z-index: 0;
            mix-blend-mode: screen;
            filter: blur(120px);
            opacity: 0.15;
            pointer-events: none;
        }

        body::before {
            background: radial-gradient(circle, #FF69B4 0%, transparent 70%);
            top: -10%; left: -10%;
            animation: flutuarLuzRosa 25s infinite alternate ease-in-out;
        }

        body::after {
            background: radial-gradient(circle, #00F0FF 0%, transparent 70%);
            bottom: -10%; right: -10%;
            animation: flutuarLuzAzul 30s infinite alternate ease-in-out;
        }

        .brilhos-fundo {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 20px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
            animation: piscarEstrelas 8s linear infinite;
            opacity: 0.4;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes movimentoGalaxia {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes flutuarLuzRosa {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(150px, 100px) scale(1.2); }
            100% { transform: translate(50px, 200px) scale(0.9); }
        }

        @keyframes flutuarLuzAzul {
            0% { transform: translate(0, 0) scale(1.2); }
            50% { transform: translate(-200px, -100px) scale(0.8); }
            100% { transform: translate(-100px, -50px) scale(1.1); }
        }

        @keyframes piscarEstrelas {
            0% { opacity: 0.3; }
            50% { opacity: 0.6; }
            100% { opacity: 0.3; }
        }

        h1, p.instrucao, .universo-container {
            position: relative;
            z-index: 1;
        }

        h1 {
            margin-top: 30px;
            font-size: 2.5rem;
            text-shadow: 0 0 15px rgba(255, 105, 180, 0.7);
            color: #FFB6C1;
            text-align: center;
        }

        p.instrucao {
            color: #E0E0E0;
            font-style: italic;
            margin-bottom: 40px;
        }

        .universo-container {
            position: relative;
            width: 900px;
            height: 550px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.02);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px);
        }

        .estrela {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #FFF;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 15px #FFF, 0 0 25px #FF69B4;
            transition: transform 0.3s, background-color 0.3s;
            z-index: 10;
            transform: translate(-50%, -50%);
        }

        .estrela:hover {
            transform: translate(-50%, -50%) scale(1.6);
            background-color: #FF69B4;
            box-shadow: 0 0 20px #FFF, 0 0 35px #FF1493;
        }

        .titulo-constelacao {
            position: absolute;
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 3px;
        }

        svg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
        }

        line {
            stroke: rgba(255, 255, 255, 0.3);
            stroke-width: 1.2;
            stroke-dasharray: 4;
        }

        .modal {
            display: none; 
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-conteudo {
            background: linear-gradient(135deg, #1f1f3a, #2d142c);
            padding: 25px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            border: 2px solid #FF69B4;
            box-shadow: 0 0 25px rgba(255, 105, 180, 0.5);
            animation: aparecer 0.4s ease-out;
        }

        @keyframes aparecer {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-conteudo img {
            max-width: 100%;
            max-height: 350px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 3px solid white;
        }

        .modal-conteudo p {
            font-size: 1.1rem;
            line-height: 1.5;
            color: #FFF;
        }

        .botao-fechar {
            background-color: #FF69B4;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            transition: background 0.2s;
        }

        .botao-fechar:hover {
            background-color: #FF1493;
        }
    </style>
</head>

    <script>
        const estrelas = document.querySelectorAll('.estrela');
        const modal = document.getElementById('meuModal');
        const fotoModal = document.getElementById('fotoModal');
        const textoModal = document.getElementById('textoModal');
        const musica = document.getElementById('musicaFundo');
        
        estrelas.forEach(estrela => {
            estrela.addEventListener('click', () => {
                const nomeDaFoto = estrela.getAttribute('data-foto');
                const textoRomantico = estrela.getAttribute('data-texto');

                fotoModal.src = 'assets/' + nomeDaFoto;
                textoModal.innerHTML = textoRomantico;

                modal.style.display = 'flex';

                // Toca a música e omite qualquer erro no console 
                musica.play().catch(() => {});
            });
        });

        function fecharModal() {
            modal.style.display = 'none';
        }

        window.addEventListener('click', (event) => {
            if (event.target === modal) {
                fecharModal();
            }
        });
    </script>
